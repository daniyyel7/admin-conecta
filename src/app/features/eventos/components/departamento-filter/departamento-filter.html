<div appClickOutside (clickOutside)="close()" (keydown.escape)="close()">
  <button
    type="button"
    class="filter-btn"
    [class.is-active]="isFiltered()"
    (click)="toggleOpen()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    aria-controls="depto-popover"
  >
    <svg class="size-4 shrink-0 text-accent-fg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h16M7 12h10M10 18h4" />
    </svg>
    <span>Departamento:</span>
    <span class="rounded-md bg-accent/15 px-1.5 py-0.5 text-[11px] font-semibold text-accent-fg">{{ badge() }}</span>
    <svg class="size-4 shrink-0 text-muted transition" [class.rotate-180]="open()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (open()) {
    <div
      id="depto-popover"
      role="dialog"
      aria-label="Filtrar por departamento"
      class="popover absolute left-0 z-30 mt-2 w-[min(18rem,calc(100vw-2rem))]"
    >
      <div class="p-2.5">
        <label class="relative block">
          <span class="sr-only">Buscar departamento</span>
          <svg class="pointer-events-none absolute top-1/2 left-2.5 size-3.5 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          <input
            #search
            type="search"
            placeholder="Buscar departamento..."
            class="w-full rounded-md border border-line bg-field py-2 pr-2 pl-8 text-xs text-fg outline-none placeholder:text-subtle focus:border-accent/60"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </label>
      </div>

      <label class="flex cursor-pointer items-center gap-2.5 border-b border-line px-4 pb-2.5 text-xs font-semibold text-fg">
        <input
          type="checkbox"
          class="check"
          [checked]="allChecked()"
          [indeterminate]="someChecked()"
          (change)="toggleAll()"
        />
        (Seleccionar todo)
        <span class="ml-auto font-mono text-[11px] font-normal text-muted">{{ total() }} evts</span>
      </label>

      <ul class="max-h-64 overflow-y-auto py-1.5">
        @for (opt of visibles(); track opt.depto.id) {
          <li>
            <label class="flex cursor-pointer items-center gap-2.5 px-4 py-2 text-xs text-fg-2 hover:bg-hover">
              <input
                type="checkbox"
                class="check"
                [checked]="isChecked(opt.depto.id)"
                (change)="toggle(opt.depto.id)"
              />
              <span class="size-2 shrink-0 rounded-full" [style.background]="opt.depto.color" aria-hidden="true"></span>
              <span class="min-w-0 flex-1 truncate" [title]="opt.depto.nombre">{{ opt.depto.nombre }}</span>
              <span class="rounded-md bg-chip px-1.5 py-0.5 text-[10px] text-muted">({{ opt.count }})</span>
            </label>
          </li>
        } @empty {
          <li class="px-4 py-3 text-center text-xs text-muted">Sin coincidencias.</li>
        }
      </ul>

      <div class="flex items-center justify-between border-t border-line px-3 py-2.5">
        <button type="button" class="rounded-md px-2 py-1 text-xs text-muted transition hover:text-fg focus-visible:outline-2 focus-visible:outline-accent" (click)="clear()">
          Limpiar
        </button>
        <button
          type="button"
          class="rounded-md bg-accent px-3 py-1.5 text-xs font-bold text-on-accent transition hover:brightness-105 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="draft().size === 0"
          (click)="apply()"
        >
          Aplicar
        </button>
      </div>
    </div>
  }
</div>
