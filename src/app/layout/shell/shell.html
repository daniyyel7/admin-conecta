<!-- Con <base href="/admin/"> un href="#..." recargaría la raíz, por eso el foco se mueve por código -->
<a href="#contenido" class="skip-link" (click)="skipToContent($event)">Saltar al contenido</a>

<header class="app-header sticky top-0 z-30 border-b border-line bg-header/95 backdrop-blur">
  <div class="flex h-16 items-center gap-3 px-4 md:h-20 md:gap-8 md:px-9">
    <!-- Hamburguesa (solo móvil) -->
    <button
      #menuButton
      type="button"
      class="icon-btn -ml-1 grid place-items-center md:hidden"
      (click)="openMenu()"
      aria-label="Abrir menú"
      aria-controls="mobile-drawer"
      [attr.aria-expanded]="menuOpen()"
    >
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <a
      routerLink="/"
      class="shrink-0 rounded text-[17px] font-medium text-fg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
    >
      Conecta7
    </a>

    <!-- Pestañas (escritorio) -->
    <nav aria-label="Principal" class="-mb-px hidden h-full items-center md:flex">
      <ul class="flex h-full items-center gap-1">
        @for (item of nav; track item.path) {
          <li class="h-full">
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              ariaCurrentWhenActive="page"
              class="nav-link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <app-user-menu class="ml-auto shrink-0" (changePassword)="changePasswordOpen.set(true)" />
  </div>
</header>

<!-- Menú lateral (móvil) -->
<div class="md:hidden">
  <div
    class="drawer-backdrop fixed inset-0 z-40 bg-scrim backdrop-blur-sm"
    [class.is-open]="menuOpen()"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>

  <aside
    #drawer
    id="mobile-drawer"
    class="drawer fixed inset-y-0 left-0 z-50 flex w-[82%] max-w-[300px] flex-col border-r border-line bg-surface shadow-2xl shadow-shade"
    [class.is-open]="menuOpen()"
    [inert]="!menuOpen()"
    role="dialog"
    aria-modal="true"
    aria-label="Menú de navegación"
  >
    <div class="drawer-top flex items-center justify-between px-5 pb-4">
      <span class="flex items-center gap-2.5">
        <img src="icons/icon-48.png" width="32" height="32" alt="" class="rounded-lg" />
        <span class="text-[17px] font-medium text-fg">Conecta7</span>
      </span>
      <button type="button" class="icon-btn -mr-2 grid place-items-center" (click)="closeMenu()" aria-label="Cerrar menú">
        <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <nav aria-label="Principal móvil" class="flex-1 overflow-y-auto px-3">
      <ul class="space-y-1">
        @for (item of nav; track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              ariaCurrentWhenActive="page"
              class="drawer-link"
            >
              <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                @for (d of item.icon; track $index) {
                  <path [attr.d]="d" />
                }
              </svg>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="drawer-bottom border-t border-line px-3 pt-3">
      <div class="px-1 pb-3">
        <p class="mb-2 px-2 text-[11px] font-medium tracking-wide text-subtle uppercase">Tema</p>
        <app-theme-switcher />
      </div>
      <div class="px-3 pb-2">
        <p class="truncate text-sm font-medium text-fg">{{ userName() }}</p>
        <p class="truncate text-xs text-muted">{{ userEmail() }}</p>
      </div>
      <button type="button" class="drawer-link w-full" (click)="openChangePassword()">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        Cambiar contraseña
      </button>
      <button type="button" class="drawer-link w-full hover:text-danger" (click)="logout()">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>
</div>

<main id="contenido" class="app-main flex-1 px-4 py-5 md:px-9 md:py-6" tabindex="-1">
  <router-outlet />
</main>

@if (changePasswordOpen()) {
  <app-change-password-dialog (closed)="changePasswordOpen.set(false)" />
}
