<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>Conecta 7 · Administrador</title>
    <base href="/" />
    <!-- Aplica el tema antes de pintar para evitar parpadeo (ver core/theme/theme.ts) -->
    <script>
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('c7.theme') || 'system'; } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- SEO base (cada ruta lo actualiza desde SeoTitleStrategy) -->
    <meta
      name="description"
      content="Panel de administración de Conecta7 para la gestión de recursos, eventos eclesiásticos y ministerios locales de la Unión Mexicana de Chiapas."
    />
    <!-- Por defecto no indexar: las páginas públicas (login) lo cambian a index -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="application-name" content="Conecta7 Admin" />
    <meta name="author" content="Unión Mexicana de Chiapas" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / redes sociales -->

    <meta property="og:locale" content="es_MX" />
    <meta property="og:title" content="Conecta 7 · Administrador" />
    <meta
      property="og:description"
      content="Panel de administración de Conecta7 para la gestión de recursos, eventos eclesiásticos y ministerios locales de la Unión Mexicana de Chiapas."

    <meta property="og:url" content="https://app.umch.org.mx/admin/" />

    <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#141518" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Fuente -->

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"

    />
